<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Opentype.js 한글 폰트 패스 추출기</title>
  <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 30px; background: #f1f5f9; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    textarea { width: 100%; height: 120px; font-family: monospace; font-size: 13px; margin: 10px 0; box-sizing: border-box; }
    .row { display: flex; gap: 20px; margin-top: 20px; }
    .col { flex: 1; text-align: center; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; }
    #hanzi-box { margin: 0 auto; }
  </style>
</head>
<body>
<div class="container">
  <h2>Opentype.js 실제 궁서체('ㄱ') 자동 추출 및 HanziWriter 연동</h2>
  <div id="status">폰트 로딩 중...</div>

  <div class="row">
    <div class="col">
      <h3>1. 폰트 원본 추출 SVG Path</h3>
      <svg id="raw-svg" width="300" height="300" viewBox="0 0 1024 1024" style="background:#f8fafc; border:1px dashed #cbd5e1;"></svg>
    </div>
    <div class="col">
      <h3>2. HanziWriter 연동 테스트</h3>
      <div id="hanzi-box"></div>
      <button style="margin-top:10px; padding:8px 16px; cursor:pointer;" onclick="writer && writer.animateCharacter()">애니메이션 재생</button>
    </div>
  </div>

  <h3 style="margin-top:20px;">추출된 SVG Path Data</h3>
  <textarea id="output-path" readonly></textarea>
</div>

<script>
  // GowunDodum 또는 NanumPenScript 등 테스트
  const fontUrl = './assets/fonts/NanumPenScript.ttf';
  let loadedFont = null;
  let writer = null;

  opentype.load(fontUrl, function(err, font) {
    const status = document.getElementById('status');
    if (err) {
      status.textContent = '폰트 로드 실패: ' + err.message;
      status.style.color = 'red';
      return;
    }
    loadedFont = font;
    status.textContent = '궁서체(Gungsuh.ttf) 로드 완료!';
    status.style.color = '#16a34a';

    extractAndRender('ㄱ');
  });

  function extractAndRender(char) {
    const glyph = loadedFont.charToGlyph(char);
    const bbox = glyph.getBoundingBox();
    
    // HanziWriter의 기본 뷰박스 1024x1024 내에 중앙 배치 (여백 150)
    const targetSize = 750;
    const glyphWidth = bbox.x2 - bbox.x1;
    const glyphHeight = bbox.y2 - bbox.y1;
    const scale = targetSize / Math.max(glyphWidth, glyphHeight);
    
    const offsetX = (1024 - glyphWidth * scale) / 2 - bbox.x1 * scale;
    // HanziWriter는 Y축이 위쪽이 + (수학 좌표계: 통상 100~900)
    // glyph 좌표계 역시 위쪽이 + 이므로 scale과 offset만 맞춰주면 됨!
    const offsetY = (1024 - glyphHeight * scale) / 2 - bbox.y1 * scale;

    // 패스 명령어를 HanziWriter 좌표계로 스케일 변환하여 SVG Path 생성
    let pathData = "";
    glyph.path.commands.forEach(cmd => {
      if (cmd.type === 'M') {
        pathData += `M ${(cmd.x * scale + offsetX).toFixed(1)} ${(cmd.y * scale + offsetY).toFixed(1)} `;
      } else if (cmd.type === 'L') {
        pathData += `L ${(cmd.x * scale + offsetX).toFixed(1)} ${(cmd.y * scale + offsetY).toFixed(1)} `;
      } else if (cmd.type === 'Q') {
        pathData += `Q ${(cmd.x1 * scale + offsetX).toFixed(1)} ${(cmd.y1 * scale + offsetY).toFixed(1)} ${(cmd.x * scale + offsetX).toFixed(1)} ${(cmd.y * scale + offsetY).toFixed(1)} `;
      } else if (cmd.type === 'C') {
        pathData += `C ${(cmd.x1 * scale + offsetX).toFixed(1)} ${(cmd.y1 * scale + offsetY).toFixed(1)} ${(cmd.x2 * scale + offsetX).toFixed(1)} ${(cmd.y2 * scale + offsetY).toFixed(1)} ${(cmd.x * scale + offsetX).toFixed(1)} ${(cmd.y * scale + offsetY).toFixed(1)} `;
      } else if (cmd.type === 'Z') {
        pathData += 'Z ';
      }
    });

    document.getElementById('output-path').value = pathData.trim();

    // 1. 원본 SVG 렌더 (수학 좌표계 -> 스크린 좌표계 변환을 위해 transform Y-flip)
    const rawSvg = document.getElementById('raw-svg');
    rawSvg.innerHTML = `<g transform="translate(0, 1024) scale(1, -1)"><path d="${pathData}" fill="#334155" /></g>`;

    // 2. Medians 자동/수동 정의 (정규화된 박스 중심선)
    const minX = (bbox.x1 * scale + offsetX);
    const maxX = (bbox.x2 * scale + offsetX);
    const minY = (bbox.y1 * scale + offsetY);
    const maxY = (bbox.y2 * scale + offsetY);
    
    // 'ㄱ' 획순에 맞춘 뼈대 (좌상 -> 우상 -> 우하)
    const medians = [
      [
        [Math.round(minX + 40), Math.round(maxY - 50)],
        [Math.round((minX + maxX)/2), Math.round(maxY - 40)],
        [Math.round(maxX - 50), Math.round(maxY - 50)],
        [Math.round(maxX - 50), Math.round((minY + maxY)/2)],
        [Math.round(maxX - 50), Math.round(minY + 40)]
      ]
    ];

    const hanziData = {
      "strokes": [pathData.trim()],
      "medians": medians
    };

    document.getElementById('hanzi-box').innerHTML = '';
    writer = HanziWriter.create('hanzi-box', char, {
      width: 280,
      height: 280,
      showOutline: true,
      showCharacter: false,
      strokeColor: '#2563eb',
      outlineColor: '#e2e8f0',
      charDataLoader: function(c, onComplete) {
        onComplete(hanziData);
      }
    });
  }
</script>
</body>
</html>
