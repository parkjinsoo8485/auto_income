<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body { background: #0a0f1e; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
.box { width: 320px; height: 320px; background: #faf6ee; border-radius: 24px; padding: 12px; display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
svg { width: 280px; height: 280px; }
</style>
<script src="../hangul_variant_dispatcher.js"></script>
<script src="../hangul_variant_data.js"></script>
<script src="../hangul_bongseo_engine.js"></script>
</head>
<body>
<div class="box" id="container"></div>
<script>
window.addEventListener('DOMContentLoaded', () => {
    const svg = HangulBongseoEngine.renderSvg('성', {
        style: 'bongseo',
        showNumbers: true,
        showGrid: false,
        animated: false,
        theme: 'hanji'
    });
    document.getElementById('container').innerHTML = svg;
});
</script>
</body>
</html>
