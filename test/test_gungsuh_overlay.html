<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<style>
@font-face {
  font-family: 'Gungsuh';
  src: url('assets/fonts/Gungsuh.ttf') format('truetype');
}
body { background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
svg { width: 340px; height: 340px; background: #1a2236; border: 2px dashed #6366f1; border-radius: 24px; }
</style>
</head>
<body>
<svg viewBox='0 0 200 200'>
  <!-- Grid -->
  <line x1='100' y1='10' x2='100' y2='190' stroke='rgba(255,255,255,0.08)' stroke-width='1'/>
  <line x1='10' y1='100' x2='190' y2='100' stroke='rgba(255,255,255,0.08)' stroke-width='1'/>
  
  <!-- Gungsuh Underlay Silhouette (Practice Guide) -->
  <text x='100' y='152' text-anchor='middle' font-family='Gungsuh' font-size='145' fill='rgba(255,255,255,0.22)'>화</text>
  
  <!-- Exact Gungsuh Stroke Paths -->
  <!-- 1. 꼭지 점 -->
  <path d='M 72,36 L 72,48' stroke='#38bdf8' stroke-width='9.0' stroke-linecap='round'/>
  <!-- 2. 가로선 -->
  <path d='M 36,60 L 110,60' stroke='#818cf8' stroke-width='7.0' stroke-linecap='round'/>
  <!-- 3. 이응 -->
  <path d='M 78,77 A 17,17 0 1,0 78.01,77 Z' fill='none' stroke='#a78bfa' stroke-width='9.5' stroke-linecap='round'/>
  <!-- 4. ㅗ 세로 -->
  <path d='M 78,111 L 78,128' stroke='#f472b6' stroke-width='7.0' stroke-linecap='round'/>
  <!-- 5. ㅗ 가로 -->
  <path d='M 32,128 L 140,128' stroke='#fbbf24' stroke-width='7.0' stroke-linecap='round'/>
  <!-- 6. ㅏ 세로 기둥 -->
  <path d='M 140,22 L 140,178' stroke='#34d399' stroke-width='14.0' stroke-linecap='round'/>
  <!-- 7. ㅏ 우측 가지 -->
  <path d='M 140,106 L 178,106' stroke='#f87171' stroke-width='7.0' stroke-linecap='round'/>
</svg>
</body>
</html>
