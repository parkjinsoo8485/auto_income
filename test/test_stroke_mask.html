function decomposeHangul(ch) {
  const code = ch.charCodeAt(0) - 0xAC00;
  if (code < 0 || code > 11171) return { cho: ch, jung: null, jong: null };
  const jong = code % 28;
  const jung = Math.floor((code - jong) / 28) % 21;
  const cho  = Math.floor((code - jong) / 28 / 21);
  return { cho: _CHOS[cho], jung: _JUNGS[jung], jong: jong ? _JONGS[jong] : null, choIdx: cho, jungIdx: jung, jongIdx: jong };

// ── 음절 6대 레이아웃 분해 및 바운딩 박스 계산 (viewBox 0 0 200 200 기준) ──
function getSyllableLayout(ch) {
  const dec = decomposeHangul(ch);
  if (!dec.jung) {
    return [{ jamo: dec.cho || ch, x: 25, y: 25, w: 150, h: 150 }];
  }

  const { cho, jung, jong, jungIdx } = dec;
  const hasJong = !!jong;

  const isVert = [0,1,2,3,4,5,6,7,20].includes(jungIdx);
  const isHoriz = [8,12,13,17,18].includes(jungIdx);

  const parts = [];

  if (isVert) {
    if (!hasJong) {
      parts.push({ jamo: cho, x: 26, y: 35, w: 72, h: 125, role: 'cho' });
      parts.push({ jamo: jung, x: 104, y: 30, w: 72, h: 135, role: 'jung' });
    } else {
      parts.push({ jamo: cho, x: 26, y: 26, w: 70, h: 72, role: 'cho' });
      parts.push({ jamo: jung, x: 104, y: 24, w: 70, h: 86, role: 'jung' });
      parts.push({ jamo: jong, x: 40, y: 110, w: 120, h: 66, role: 'jong' });
    }
  } else if (isHoriz) {
    if (!hasJong) {
      parts.push({ jamo: cho, x: 45, y: 26, w: 110, h: 74, role: 'cho' });
      parts.push({ jamo: jung, x: 26, y: 104, w: 148, h: 68, role: 'jung' });
    } else {
      parts.push({ jamo: cho, x: 48, y: 20, w: 104, h: 56, role: 'cho' });
      parts.push({ jamo: jung, x: 30, y: 78, w: 140, h: 48, role: 'jung' });
      parts.push({ jamo: jong, x: 44, y: 124, w: 112, h: 56, role: 'jong' });
    }
  } else {
    const compMap = {
      'ㅘ': ['ㅗ','ㅏ'], 'ㅙ': ['ㅗ','ㅐ'], 'ㅚ': ['ㅗ','ㅣ'],
      'ㅝ': ['ㅜ','ㅓ'], 'ㅞ': ['ㅜ','ㅔ'], 'ㅟ': ['ㅜ','ㅣ'],
      'ㅢ': ['ㅡ','ㅣ']
    };
    const [subH, subV] = compMap[jung] || ['ㅡ','ㅣ'];

    if (!hasJong) {
      parts.push({ jamo: cho, x: 28, y: 28, w: 70, h: 72, role: 'cho' });
      parts.push({ jamo: subH, x: 24, y: 102, w: 82, h: 65, role: 'jung_h' });
      parts.push({ jamo: subV, x: 108, y: 28, w: 68, h: 138, role: 'jung_v' });
    } else {
      parts.push({ jamo: cho, x: 30, y: 22, w: 66, h: 56, role: 'cho' });
      parts.push({ jamo: subH, x: 26, y: 78, w: 76, h: 44, role: 'jung_h' });
      parts.push({ jamo: subV, x: 104, y: 22, w: 66, h: 100, role: 'jung_v' });
      parts.push({ jamo: jong, x: 42, y: 124, w: 116, h: 54, role: 'jong' });
    }
  }

  return parts;
}

function scalePath(d, x, y, w, h) {
  let i = 0;
  return d.replace(/[+-]?\d+\.?\d*/g, (num) => {
    const val = parseFloat(num);
    const res = (i % 2 === 0) ? (x + (val / 100) * w).toFixed(1) : (y + (val / 100) * h).toFixed(1);
    i++;
    return res;
  });
}

function getApproxLen(d) {
  const nums = d.replace(/[MCLZAmclza]/g,' ').trim().split(/[\s,]+/).filter(Boolean).map(Number);
  let len = 0;
  for (let i = 2; i < nums.length - 1; i += 2) {
    const dx = nums[i] - nums[i-2];
    const dy = nums[i+1] - nums[i-1];
    len += Math.sqrt(dx*dx + dy*dy);
  }
  return Math.max(len, 70);
}

let S = {
  word: '한국어',
  charIdx: 0,
  speed: 1.0,
  showNumbers: true
};

function updateWord() {
  const input = document.getElementById('test-word').value.trim();
  if (!input) return;
  S.word = input;
  S.charIdx = 0;
  renderWordTabs();
  renderStrokeView();
}

function renderWordTabs() {
  const tabsContainer = document.getElementById('char-tabs');
  tabsContainer.innerHTML = '';
  [...S.word].forEach((ch, idx) => {
    const btn = document.createElement('button');
    btn.className = `char-tab ${idx === S.charIdx ? 'active' : ''}`;
    btn.textContent = ch;
    btn.onclick = () => {
      S.charIdx = idx;
      renderWordTabs();
      renderStrokeView();
    };
    tabsContainer.appendChild(btn);
  });
}

function toggleSpeed() {
  const speeds = [0.5, 1.0, 1.5, 2.0];
  const idx = speeds.indexOf(S.speed);
  S.speed = speeds[(idx + 1) % speeds.length];
  document.getElementById('btn-speed').textContent = `속도 ${S.speed.toFixed(1)}x`;
  renderStrokeView();
}

function toggleNumbers() {
  S.showNumbers = !S.showNumbers;
  document.getElementById('btn-num').textContent = `획 번호: ${S.showNumbers ? 'ON' : 'OFF'}`;
  renderStrokeView();
}

function replayCurrent() {
  renderStrokeView();
}

function renderStrokeView() {
  const ch = S.word[S.charIdx] || S.word[0];
  const parts = getSyllableLayout(ch);

  const strokes = [];
  parts.forEach(part => {
    let jamosToProcess = [part.jamo];
    if (part.role === 'jong' && _DOUBLE_JONGS[part.jamo]) {
      jamosToProcess = _DOUBLE_JONGS[part.jamo];
    }

    jamosToProcess.forEach((j, subIdx) => {
      const list = STROKE_DB[j] || [];
      let sx = part.x, sw = part.w;
      if (jamosToProcess.length > 1) {
        sw = part.w * 0.48;
        sx = subIdx === 0 ? part.x : part.x + part.w * 0.52;
      }
      list.forEach(st => {
        const scaledD = scalePath(st.d, sx, part.y, sw, part.h);
        strokes.push({
          d: scaledD,
          desc: st.desc
        });
      });
    });
  });

  document.getElementById('stroke-info').innerHTML = `선택 음절: <b style="color:#818cf8">${ch}</b> (총 <b style="color:#fbbf24">${strokes.length}획</b>)`;

  const strokeDur = 0.55 / S.speed;
  const gapDur = 0.18 / S.speed;

  let maskPaths = '';
  let numberMarkers = '';
  const colors = ['#818cf8', '#a78bfa', '#f472b6', '#38bdf8', '#34d399', '#fbbf24', '#f87171'];

  strokes.forEach((st, idx) => {
    const len = getApproxLen(st.d);
    const delay = idx * (strokeDur + gapDur);

    maskPaths += `
      <path d="${st.d}"
            stroke="white"
            stroke-width="38"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
            stroke-dasharray="${len.toFixed(1)}"
            stroke-dashoffset="${len.toFixed(1)}"
            style="animation: drawStrokeMask ${strokeDur.toFixed(2)}s linear ${delay.toFixed(2)}s forwards;" />
    `;

    if (S.showNumbers) {
      const nums = st.d.replace(/[MCLZAmclza]/g,' ').trim().split(/[\s,]+/).filter(Boolean).map(Number);
      const bx = nums[0] || 100;
      const by = nums[1] || 100;
      const color = colors[idx % colors.length];

      numberMarkers += `
        <g style="opacity:0; animation: showMarker 0.3s ease ${delay.toFixed(2)}s forwards;">
          <circle cx="${bx}" cy="${by}" r="9" fill="#0f172a" stroke="${color}" stroke-width="2"/>
          <text x="${bx}" y="${by}" fill="${color}" font-size="10" font-weight="900" text-anchor="middle" dominant-baseline="central" font-family="'Inter', sans-serif">${idx+1}</text>
        </g>
      `;
    }
  });

  const uniqueId = 'mask_' + Math.random().toString(36).substr(2, 9);

  const svgHTML = `
    <svg viewBox="0 0 200 200" width="260" height="260" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <style>
          @keyframes drawStrokeMask {
            to { stroke-dashoffset: 0; }
          }
          @keyframes showMarker {
            to { opacity: 1; }
          }
        </style>
        <mask id="${uniqueId}">
          <rect width="200" height="200" fill="black" />
          ${maskPaths}
        </mask>
      </defs>

      <line x1="100" y1="10" x2="100" y2="190" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <line x1="10" y1="100" x2="190" y2="100" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <rect x="15" y="15" width="170" height="170" rx="16" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="4,4"/>

      <!-- 밑그림 -->
      <text x="100" y="105"
            text-anchor="middle" dominant-baseline="central"
            font-size="135" font-weight="900"
            font-family="'Noto Sans KR', sans-serif"
            fill="rgba(255,255,255,0.08)">${ch}</text>

      <!-- 획순대로 드러나는 글씨 -->
      <text x="100" y="105"
            text-anchor="middle" dominant-baseline="central"
            font-size="135" font-weight="900"
            font-family="'Noto Sans KR', sans-serif"
            fill="#818cf8"
            mask="url(#${uniqueId})">${ch}</text>

      <!-- 번호 마커 -->
      ${numberMarkers}
    </svg>
  `;

  document.getElementById('preview-box').innerHTML = svgHTML;
}

updateWord();
</script>
