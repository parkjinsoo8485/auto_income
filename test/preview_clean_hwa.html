<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="background:#0a0f1e;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;">
  <div style="width:260px;height:260px;background:#111827;border:2px dashed #6366f1;border-radius:24px;display:flex;align-items:center;justify-content:center;position:relative;">
    <svg viewBox="0 0 200 200" width="220" height="220">
      <!-- Grid -->
      <line x1="100" y1="12" x2="100" y2="188" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <line x1="12" y1="100" x2="188" y2="100" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <line x1="14" y1="14" x2="186" y2="186" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="186" y1="14" x2="14" y2="186" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="3,3"/>
      <rect x="14" y="14" width="172" height="172" rx="14" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="4,4"/>

      <!-- NO UNDERLAY (Completely Clean) -->

      <!-- [Type 3: '화'] -->
      <!-- 초성 ㅎ: slot x=24, y=20, w=78, h=72. 초성 영역 y: 20~92 -->
      <!-- 1획: 꼭지점 -->
      <path d="M 52,28 L 74,28" fill="none" stroke="#38bdf8" stroke-width="11" stroke-linecap="round"/>
      <g><circle cx="52" cy="28" r="9.5" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text x="52" y="31.5" text-anchor="middle" font-size="9.5" font-weight="900" fill="#fff" font-family="sans-serif">1</text></g>

      <!-- 2획: 가로선 -->
      <path d="M 32,46 L 94,46" fill="none" stroke="#818cf8" stroke-width="11" stroke-linecap="round"/>
      <g><circle cx="32" cy="46" r="9.5" fill="#0f172a" stroke="#818cf8" stroke-width="2"/><text x="32" y="49.5" text-anchor="middle" font-size="9.5" font-weight="900" fill="#fff" font-family="sans-serif">2</text></g>

      <!-- 3획: 원 (y: 56 ~ 88, 초성 하단 y=88) -->
      <path d="M 63,58 C 48,58 38,65 38,73 C 38,81 48,88 63,88 C 78,88 88,81 88,73 C 88,65 78,58 63,58 Z" fill="none" stroke="#a78bfa" stroke-width="10" stroke-linecap="round"/>
      <g><circle cx="63" cy="58" r="9.5" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text x="63" y="61.5" text-anchor="middle" font-size="9.5" font-weight="900" fill="#fff" font-family="sans-serif">3</text></g>

      <!-- 중성 ㅗ: slot x=20, y=98, w=84, h=80 (상하 여백: ㅎ 바닥 y=88, ㅗ 시작 y=100 -> 12px 완벽 분리!) -->
      <!-- 4획: ㅗ 세로선 (y: 100 ~ 138) -->
      <path d="M 62,100 L 62,138" fill="none" stroke="#f472b6" stroke-width="11" stroke-linecap="round"/>
      <g><circle cx="62" cy="100" r="9.5" fill="#0f172a" stroke="#f472b6" stroke-width="2"/><text x="62" y="103.5" text-anchor="middle" font-size="9.5" font-weight="900" fill="#fff" font-family="sans-serif">4</text></g>

      <!-- 5획: ㅗ 가로선 (y: 138, x: 24 ~ 100) -->
      <path d="M 26,138 L 100,138" fill="none" stroke="#fbbf24" stroke-width="11" stroke-linecap="round"/>
      <g><circle cx="26" cy="138" r="9.5" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/><text x="26" y="141.5" text-anchor="middle" font-size="9.5" font-weight="900" fill="#fff" font-family="sans-serif">5</text></g>

      <!-- 중성 ㅏ: slot x=112, y=20, w=64, h=160 (좌우 여백: ㅗ 우단 x=100, ㅏ 기둥 x=142 -> 42px 완벽 분리!) -->
      <!-- 6획: ㅏ 세로선 (y: 20 ~ 176) -->
      <path d="M 142,22 L 142,176" fill="none" stroke="#34d399" stroke-width="11" stroke-linecap="round"/>
      <g><circle cx="142" cy="22" r="9.5" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="142" y="25.5" text-anchor="middle" font-size="9.5" font-weight="900" fill="#fff" font-family="sans-serif">6</text></g>

      <!-- 7획: ㅏ 가로선 (y: 98, x: 142 ~ 172) -->
      <path d="M 142,98 L 172,98" fill="none" stroke="#f87171" stroke-width="11" stroke-linecap="round"/>
      <g><circle cx="142" cy="98" r="9.5" fill="#0f172a" stroke="#f87171" stroke-width="2"/><text x="142" y="101.5" text-anchor="middle" font-size="9.5" font-weight="900" fill="#fff" font-family="sans-serif">7</text></g>
    </svg>
  </div>
</body>
</html>
