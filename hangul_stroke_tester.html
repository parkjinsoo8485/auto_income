<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>한글 획순 쓰기 스튜디오 Pro | Hangul Stroke Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=Noto+Serif+KR:wght@600;900&family=Noto+Sans+KR:wght@700;900&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Pen+Script&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #edf2f7 50%, #f1f5f9 100%);
  --surface-card: rgba(255, 255, 255, 0.96);
  --surface-subtle: #f8fafc;
  --surface-active: #f1f5f9;
  
  --primary: #059669;
  --primary-hover: #047857;
  --primary-light: #ecfdf5;
  --primary-glow: rgba(16, 185, 129, 0.35);

  --accent-blue: #2563eb;
  --accent-indigo: #6366f1;
  --accent-amber: #f59e0b;
  --accent-rose: #f43f5e;
  --accent-cyan: #06b6d4;

  --text-main: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;

  --border-light: #e2e8f0;
  --border-focus: #3b82f6;

  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 8px 24px -4px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 20px 35px -10px rgba(15, 23, 42, 0.12);

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-full: 9999px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
  background: var(--bg-gradient);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px 48px;
  touch-action: pan-y;
}

/* 상단 앱 바 헤더 */
.app-header {
  width: 100%;
  max-width: 1100px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding: 0 4px;
}

.brand-wrapper {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-icon {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: linear-gradient(135deg, #059669 0%, #10b981 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 26px;
  box-shadow: 0 8px 18px -4px rgba(16, 185, 129, 0.45);
}

.brand-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-badge {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: 2px 8px;
  border-radius: 999px;
  background: #e0f2fe;
  color: #0369a1;
  border: 1px solid #bae6fd;
}

.brand-sub {
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 500;
  margin-top: 2px;
}

.header-tools {
  display: flex;
  align-items: center;
  gap: 10px;
}

.tool-toggle-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-light);
  background: #fff;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--shadow-sm);
}

.tool-toggle-btn:hover {
  background: var(--surface-subtle);
  border-color: #cbd5e1;
  color: var(--text-main);
}

.tool-toggle-btn.active {
  background: #ecfdf5;
  border-color: #6ee7b7;
  color: #047857;
}

/* 2열 메인 레이아웃 */
.studio-layout {
  width: 100%;
  max-width: 1100px;
  display: grid;
  grid-template-columns: 480px 1fr;
  gap: 24px;
  align-items: start;
}

@media (max-width: 980px) {
  .studio-layout {
    grid-template-columns: 1fr;
    max-width: 520px;
  }
}

.panel-card {
  background: var(--surface-card);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(226, 232, 240, 0.9);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  padding: 24px;
}

/* 좌측 캔버스 패널 */
.canvas-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.input-section {
  width: 100%;
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
}

.char-input-wrapper {
  position: relative;
  flex: 1;
}

.char-input-field {
  width: 100%;
  height: 48px;
  padding: 0 16px 0 44px;
  font-size: 19px;
  font-weight: 800;
  color: var(--text-main);
  background: #fff;
  border: 2px solid var(--border-light);
  border-radius: var(--radius-md);
  outline: none;
  transition: all 0.2s;
  box-shadow: var(--shadow-sm);
}

.char-input-field:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px var(--primary-glow);
}

.char-input-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
  color: var(--text-muted);
  pointer-events: none;
}

.btn-apply {
  height: 48px;
  padding: 0 20px;
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-apply:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(5, 150, 105, 0.35);
}

/* 프리셋 탭 & 칩 */
.preset-section {
  width: 100%;
  margin-bottom: 14px;
}

.preset-tabs {
  display: flex;
  gap: 6px;
  border-bottom: 1px solid var(--border-light);
  padding-bottom: 8px;
  margin-bottom: 10px;
  overflow-x: auto;
}

.preset-tab-btn {
  background: none;
  border: none;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: all 0.2s;
  white-space: nowrap;
}

.preset-tab-btn.active {
  background: var(--surface-active);
  color: var(--primary);
  font-weight: 700;
}

.preset-chips-container {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.preset-chip {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-light);
  background: #fff;
  font-size: 17px;
  font-weight: 700;
  color: var(--text-main);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
  box-shadow: var(--shadow-sm);
}

.preset-chip:hover {
  border-color: var(--primary);
  background: var(--primary-light);
  color: var(--primary-hover);
  transform: translateY(-2px);
}

.preset-chip.active {
  border-color: var(--primary);
  background: var(--primary);
  color: #fff;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.3);
}

/* 모드 선택 바 */
.mode-switcher-row {
  width: 100%;
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  background: #f1f5f9;
  padding: 4px;
  border-radius: var(--radius-md);
}

.mode-tab-btn {
  flex: 1;
  padding: 10px 8px;
  font-size: 13px;
  font-weight: 700;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.2s ease;
}

.mode-tab-btn:hover {
  color: var(--text-main);
}

.mode-tab-btn.active {
  background: #fff;
  color: var(--accent-blue);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

/* 캔버스 컨테이너 */
.canvas-container {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  max-width: 440px;
  background: #ffffff;
  border-radius: var(--radius-lg);
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.04), 0 8px 24px -6px rgba(15, 23, 42, 0.1);
  border: 2px solid #e2e8f0;
  overflow: hidden;
  user-select: none;
  touch-action: none; /* 드래그 시 화면 스크롤 완전 방지 */
}

.canvas-grid-box {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.grid-h-center {
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  height: 1px;
  background: rgba(148, 163, 184, 0.35);
  border-top: 1px dashed rgba(148, 163, 184, 0.5);
}

.grid-v-center {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 1px;
  background: rgba(148, 163, 184, 0.35);
  border-left: 1px dashed rgba(148, 163, 184, 0.5);
}

.grid-diag-1, .grid-diag-2 {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0.25;
}

#stroke-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: block;
  cursor: crosshair;
}

/* 실시간 판정 상태 메시지 배너 */
.test-feedback-banner {
  width: 100%;
  margin-top: 12px;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  transition: all 0.25s ease;
}

.test-feedback-banner.success {
  background: #ecfdf5;
  border-color: #6ee7b7;
  color: #047857;
  animation: pulse-border 1.2s infinite;
}

.test-feedback-banner.error {
  background: #fff1f2;
  border-color: #fca5a5;
  color: #be123c;
  animation: shake 0.35s ease;
}

@keyframes pulse-border {
  0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
  70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
  100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* 캔버스 미니 툴바 */
.canvas-toolbar {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 12px;
  padding: 0 4px;
}

.toolbar-group {
  display: flex;
  align-items: center;
  gap: 8px;
}

.tool-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
}

.color-dot {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
  transition: transform 0.15s ease;
}

.color-dot:hover {
  transform: scale(1.15);
}

.color-dot.active {
  outline: 2px solid var(--accent-blue);
  outline-offset: 1px;
}

.mini-slider {
  width: 70px;
  accent-color: var(--primary);
  cursor: pointer;
}

.mini-select {
  padding: 4px 8px;
  font-size: 11px;
  font-weight: 600;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-light);
  background: #fff;
  color: var(--text-secondary);
  outline: none;
  cursor: pointer;
  transition: border-color 0.15s;
}

.mini-select:focus {
  border-color: var(--primary);
}

/* 캔버스 액션 버튼 행 */
.control-actions-row {
  width: 100%;
  display: flex;
  gap: 10px;
  margin-top: 14px;
}

.btn-ctrl {
  flex: 1;
  height: 46px;
  border: none;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.2s;
  box-shadow: var(--shadow-sm);
}

.btn-ctrl-primary {
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #fff;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
}

.btn-ctrl-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
}

.btn-ctrl-secondary {
  background: #f1f5f9;
  color: var(--text-secondary);
}

.btn-ctrl-secondary:hover {
  background: #e2e8f0;
  color: var(--text-main);
}

.btn-ctrl-subtle {
  background: #fff;
  color: var(--text-secondary);
  border: 1px solid var(--border-light);
}

.btn-ctrl-subtle:hover {
  background: #f8fafc;
  color: var(--text-main);
}

.btn-ctrl:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none !important;
}

/* 진행 바 */
.progress-bar-wrap {
  width: 100%;
  height: 6px;
  background: #e2e8f0;
  border-radius: 999px;
  margin-top: 14px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #10b981 0%, #06b6d4 100%);
  transition: width 0.25s ease;
}

/* 우측 분석 & 정보 대시보드 */
.info-panel {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.syllable-hero-card {
  background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow-sm);
}

.syllable-display {
  display: flex;
  align-items: center;
  gap: 16px;
}

.syllable-char-box {
  width: 72px;
  height: 72px;
  background: linear-gradient(135deg, #059669 0%, #10b981 100%);
  color: #fff;
  font-family: 'Noto Serif KR', serif;
  font-size: 42px;
  font-weight: 900;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35);
}

.syllable-meta {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.syllable-name {
  font-size: 20px;
  font-weight: 800;
  color: var(--text-main);
}

.syllable-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.badge-tag {
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 999px;
  background: #f1f5f9;
  color: var(--text-secondary);
}

.badge-tag.accent {
  background: #e0f2fe;
  color: #0369a1;
}

.syllable-sound-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--border-light);
  background: #fff;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-sm);
  transition: all 0.2s;
}

.syllable-sound-btn:hover {
  background: var(--surface-subtle);
  transform: scale(1.08);
}

/* 3요소 분해 다이어그램 */
.composition-diagram {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.jamo-slot {
  background: #fff;
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 14px 10px;
  text-align: center;
  box-shadow: var(--shadow-sm);
  transition: all 0.2s ease;
}

.jamo-type-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 6px;
}

.jamo-glyph {
  font-family: 'Noto Serif KR', serif;
  font-size: 28px;
  font-weight: 900;
  color: var(--primary);
  margin-bottom: 4px;
}

.jamo-desc {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
}

/* 타임라인 카드 */
.timeline-card {
  background: #fff;
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-sm);
}

.timeline-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

.timeline-title {
  font-size: 15px;
  font-weight: 800;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 6px;
}

.total-count-badge {
  font-size: 12px;
  font-weight: 800;
  background: #f1f5f9;
  padding: 3px 10px;
  border-radius: 999px;
  color: var(--text-secondary);
}

.stroke-steps-grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 290px;
  overflow-y: auto;
  padding-right: 4px;
}

.stroke-step-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-md);
  background: #f8fafc;
  border: 1px solid var(--border-light);
  cursor: pointer;
  transition: all 0.2s;
}

.stroke-step-item:hover {
  background: #f1f5f9;
  border-color: #cbd5e1;
}

.stroke-step-item.active {
  background: #eff6ff;
  border-color: #93c5fd;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.12);
}

.stroke-step-item.completed {
  background: #ecfdf5;
  border-color: #6ee7b7;
}

.step-num-badge {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #e2e8f0;
  color: var(--text-secondary);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.stroke-step-item.active .step-num-badge {
  background: var(--accent-blue);
  color: #fff;
}

.stroke-step-item.completed .step-num-badge {
  background: #10b981;
  color: #fff;
}

.step-info-col {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.step-part-tag {
  font-size: 11px;
  font-weight: 700;
  color: var(--primary);
}

.step-instruction {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
}

.studio-footer-note {
  margin-top: 24px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 500;
}
</style>
</head>
<body>

<!-- 상단 앱 바 헤더 -->
<header class="app-header">
  <div class="brand-wrapper">
    <div class="brand-icon">훈</div>
    <div>
      <div class="brand-title">
        한글 획순 쓰기 스튜디오 Pro
        <span class="brand-badge">Engine 2.0</span>
      </div>
      <div class="brand-sub">정규화 벡터 알고리즘 & 오프라인 실시간 획순 판정 엔진</div>
    </div>
  </div>

  <div class="header-tools">
    <button class="tool-toggle-btn active" id="btn-toggle-fontmode" onclick="toggleFontGuideMode()" title="바탕 가이드 글자 형태 변경">
      <span id="fontmode-icon">🔤</span> 따라쓰기 폰트
    </button>
    <button class="tool-toggle-btn active" id="btn-toggle-sound" onclick="toggleSound()">
      <span id="sound-icon">🔊</span> 효과음 ON
    </button>
    <button class="tool-toggle-btn active" id="btn-toggle-grid" onclick="toggleGrid()">
      <span>📐</span> 격자 가이드
    </button>

<script>
/* ─────────────────────────────────────────────────────────────
   1. 오디오 합성 엔진 (Web Audio Synth - 100% Offline)
───────────────────────────────────────────────────────────── */
let soundEnabled = true;

const Sound = {
  ctx: null,
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  },
  tap(pitch = 1) {
    if (!soundEnabled) return;
    try {
      this.init();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440 * pitch, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(780 * pitch, this.ctx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.16, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.05);
    } catch(e) {}
  },
  success() {
    if (!soundEnabled) return;
    try {
      this.init();
      if (!this.ctx) return;
      // 상쾌한 2음 벨 (587.33Hz -> 880Hz)
      [587.33, 880].forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        const start = this.ctx.currentTime + idx * 0.08;
        gain.gain.setValueAtTime(0.18, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.22);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(start);
        osc.stop(start + 0.22);
      });
    } catch(e) {}
  },
  error() {
    if (!soundEnabled) return;
    try {
      this.init();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, this.ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(140, this.ctx.currentTime + 0.18);
      gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.18);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.18);
    } catch(e) {}
  },
  fanfare() {
    if (!soundEnabled) return;
    try {
      this.init();
      if (!this.ctx) return;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        const start = this.ctx.currentTime + idx * 0.07;
        gain.gain.setValueAtTime(0.2, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.32);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(start);
        osc.stop(start + 0.32);
      });
    } catch(e) {}
  }
};

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('btn-toggle-sound');
  if (soundEnabled) {
    btn.classList.add('active');
    btn.innerHTML = '<span id="sound-icon">🔊</span> 효과음 ON';
    Sound.tap(1.2);
  } else {
    btn.classList.remove('active');
    btn.innerHTML = '<span id="sound-icon">🔇</span> 효과음 OFF';
  }
}

function toggleGrid() {
  const grid = document.getElementById('grid-box');
  const btn = document.getElementById('btn-toggle-grid');
  if (grid.style.display === 'none') {
    grid.style.display = 'block';
    btn.classList.add('active');
  } else {
    grid.style.display = 'none';
    btn.classList.remove('active');
  }
}

function speakCurrentChar() {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(currentChar);
    utter.lang = 'ko-KR';
    utter.rate = 0.85;
    window.speechSynthesis.speak(utter);
  }
}

/* ─────────────────────────────────────────────────────────────
   3. 음절 분해 및 정규화 박스 변환 (Hangul Decomposer & Synthesizer)
───────────────────────────────────────────────────────────── */
function decompose(char) {
  const code = char.charCodeAt(0) - 0xAC00;
  if (code >= 0 && code <= 11171) {
    const jong = code % 28;
    const jung = Math.floor((code - jong) / 28) % 21;
    const cho = Math.floor((code - jong) / 28 / 21);
    return {
      isSyllable: true,
      cho: CHOS[cho],
      jung: JUNGS[jung],
      jong: JONGS[jong],
      jungIdx: jung,
      hasJong: jong > 0
    };
  }
  return { isSyllable: false, char: char };
}

function transformStroke(stk, box, partName) {
  if (stk.type === 'circle') {
    return {
      type: 'circle',
      cx: box.x + (stk.cx / 100) * box.w,
      cy: box.y + (stk.cy / 100) * box.h,
      r: (stk.r / 100) * Math.min(box.w, box.h),
      desc: stk.desc,
      partName: partName
    };
  }
  return {
    type: 'lines',
    pts: stk.pts.map(p => [
      box.x + (p[0] / 100) * box.w,
      box.y + (p[1] / 100) * box.h
    ]),
    desc: stk.desc,
    partName: partName
  };
}

function getJamoStrokesInBox(jamo, box, partName) {
  let strokes = [];
  if (DOUBLE_BATCHIM[jamo]) {
    const [leftJamo, rightJamo] = DOUBLE_BATCHIM[jamo];
    const leftBox = { x: box.x, y: box.y, w: box.w * 0.48, h: box.h };
    const rightBox = { x: box.x + box.w * 0.52, y: box.y, w: box.w * 0.48, h: box.h };
    if (PRIMITIVE_STROKES[leftJamo]) {
      PRIMITIVE_STROKES[leftJamo].forEach(s => strokes.push(transformStroke(s, leftBox, `${partName} [${leftJamo}]`)));
    }
    if (PRIMITIVE_STROKES[rightJamo]) {
      PRIMITIVE_STROKES[rightJamo].forEach(s => strokes.push(transformStroke(s, rightBox, `${partName} [${rightJamo}]`)));
    }
    return strokes;
  }
  if (COMPOUND_VOWELS[jamo]) {
    const [firstJamo, secondJamo] = COMPOUND_VOWELS[jamo];
    const leftBox = { x: box.x, y: box.y + box.h * 0.15, w: box.w * 0.52, h: box.h * 0.85 };
    const rightBox = { x: box.x + box.w * 0.45, y: box.y, w: box.w * 0.55, h: box.h };
    if (PRIMITIVE_STROKES[firstJamo]) {
      PRIMITIVE_STROKES[firstJamo].forEach(s => strokes.push(transformStroke(s, leftBox, `${partName} [${firstJamo}]`)));
    }
    if (PRIMITIVE_STROKES[secondJamo]) {
      PRIMITIVE_STROKES[secondJamo].forEach(s => strokes.push(transformStroke(s, rightBox, `${partName} [${secondJamo}]`)));
    }
    return strokes;
  }
  if (PRIMITIVE_STROKES[jamo]) {
    PRIMITIVE_STROKES[jamo].forEach(s => strokes.push(transformStroke(s, box, partName)));
  }
  return strokes;
}

function getStrokesForChar(char) {
  const dec = decompose(char);
  let strokes = [];

  if (dec.isSyllable) {
    const isVert = [0, 1, 2, 3, 4, 5, 6, 7, 20].includes(dec.jungIdx);
    const isHoriz = [8, 12, 13, 17, 18].includes(dec.jungIdx);
    let choBox, jungBox, jongBox;

    if (!dec.hasJong) {
      if (isVert) {
        // 좌우 분립 세로모음형 (예: '아', '가', '나')
        choBox = { x: 95, y: 120, w: 270, h: 480 };
        jungBox = { x: 385, y: 95, w: 240, h: 530 };
      } else if (isHoriz) {
        // 상하 결합 가로모음형 (예: '오', '고', '우')
        choBox = { x: 135, y: 90, w: 450, h: 260 };
        jungBox = { x: 85, y: 360, w: 550, h: 270 };
      } else {
        // 복합 모음 결합형 (예: '와', '왜', '의')
        choBox = { x: 85, y: 90, w: 260, h: 290 };
        jungBox = { x: 325, y: 80, w: 330, h: 560 };
      }
    } else {
      if (isVert) {
        // 세로모음 + 받침형 (예: '한', '달', '닭', '값')
        choBox = { x: 95, y: 65, w: 270, h: 290 };
        jungBox = { x: 385, y: 55, w: 240, h: 320 };
        jongBox = { x: 135, y: 400, w: 450, h: 260 };
      } else if (isHoriz) {
        // 가로모음 + 받침형 (예: '글', '봄', '꿈', '흙')
        choBox = { x: 135, y: 60, w: 450, h: 200 };
        jungBox = { x: 85, y: 265, w: 550, h: 175 };
        jongBox = { x: 135, y: 445, w: 450, h: 220 };
      } else {
        // 복합모음 + 받침형 (예: '꿩', '괜', '원')
        choBox = { x: 85, y: 55, w: 250, h: 240 };
        jungBox = { x: 325, y: 45, w: 330, h: 350 };
        jongBox = { x: 135, y: 435, w: 450, h: 230 };
      }
    }

    strokes.push(...getJamoStrokesInBox(dec.cho, choBox, `초성 '${dec.cho}'`));
    strokes.push(...getJamoStrokesInBox(dec.jung, jungBox, `중성 '${dec.jung}'`));
    if (dec.hasJong) {
      strokes.push(...getJamoStrokesInBox(dec.jong, jongBox, `종성 '${dec.jong}'`));
    }
  } else {
    // 단일 자모 (예: 'ㄱ', 'ㅏ')
    const box = { x: 130, y: 130, w: 460, h: 460 };
    strokes.push(...getJamoStrokesInBox(char, box, `자모 '${char}'`));
  }
  return strokes;
}

function onFontFamilyChange(val) {
  selectedFontKey = val;
  const selectEl = document.getElementById('select-font-family');

  if (val === 'tracing') {
    fontGuideMode = 'tracing';
    document.getElementById('btn-toggle-fontmode').innerHTML = '<span id="fontmode-icon">🔤</span> 따라쓰기 폰트';
    setFeedback('🔤', '바탕 모드: 획과 1:1 완벽 일치하는 정밀 따라쓰기 폰트가 선택되었습니다.');
  } else {
    fontGuideMode = 'font';
    const f = FONT_MAP[val];
    document.getElementById('btn-toggle-fontmode').innerHTML = `<span id="fontmode-icon">🖋️</span> ${f ? f.name : '폰트'}`;
    setFeedback('🔤', `바탕 모드: [${f ? f.name : val}] 서체가 캔버스에 적용되었습니다.`);
  }
  renderScene();
  Sound.tap(1.2);
}

function toggleFontGuideMode() {
  const keys = ['tracing', 'batang', 'dodum', 'serif', 'hand', 'sans'];
  const curIdx = keys.indexOf(selectedFontKey);
  const nextKey = keys[(curIdx + 1) % keys.length];
  onFontFamilyChange(nextKey);
}

function setStudioMode(mode) {
  studioMode = mode;
  document.getElementById('btn-mode-test').classList.toggle('active', mode === 'test');
  document.getElementById('btn-mode-anim').classList.toggle('active', mode === 'anim');
  document.getElementById('btn-mode-free').classList.toggle('active', mode === 'free');

    setFeedback('🎯', `1획: 파란색 배지(①)에서 시작하여 따라 써보세요!`, 'normal');

  } else {

/* ── 1. 다중 폰트 지원 바탕 따라쓰기 렌더러 ── */
function drawBackgroundGuide(strokes) {
  if (guideOpacity <= 0) return;

  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // [옵션 1] 정밀 벡터 따라쓰기 폰트 (1:1 일치 펜 글씨)
  if (selectedFontKey === 'tracing') {
    // 1단계: 외곽 부드러운 글자 바디 (회색 폰트 몸통)
    ctx.lineWidth = 52;
    ctx.strokeStyle = `rgba(203, 213, 225, ${Math.min(1.0, guideOpacity * 1.5)})`;
    strokes.forEach(s => {
      if (s.type === 'circle') {
        ctx.beginPath();
        ctx.arc(s.cx, s.cy, s.r, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(s.pts[0][0], s.pts[0][1]);
        for (let i = 1; i < s.pts.length; i++) ctx.lineTo(s.pts[i][0], s.pts[i][1]);
        ctx.stroke();
      }
    });

    // 2단계: 내부 밝은 안감 (홈 형태)
    ctx.lineWidth = 42;
    ctx.strokeStyle = `rgba(241, 245, 249, ${Math.min(1.0, guideOpacity * 1.8)})`;
    strokes.forEach(s => {
      if (s.type === 'circle') {
        ctx.beginPath();
        ctx.arc(s.cx, s.cy, s.r, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(s.pts[0][0], s.pts[0][1]);
        for (let i = 1; i < s.pts.length; i++) ctx.lineTo(s.pts[i][0], s.pts[i][1]);
        ctx.stroke();
      }
    });

    // 3단계: 획 중심 정밀 점선 가이드 (연필 중심선)
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 8]);
    ctx.strokeStyle = `rgba(148, 163, 184, ${Math.min(1.0, guideOpacity * 1.3)})`;
    strokes.forEach(s => {
      if (s.type === 'circle') {
        ctx.beginPath();
        ctx.arc(s.cx, s.cy, s.r, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(s.pts[0][0], s.pts[0][1]);
        for (let i = 1; i < s.pts.length; i++) ctx.lineTo(s.pts[i][0], s.pts[i][1]);
        ctx.stroke();
      }
    });
  } else {
    // [옵션 2] 실제 한글 웹폰트 렌더링 (바탕체, 돋움체, 명조체, 손글씨체, 고딕체)
    const fontInfo = FONT_MAP[selectedFontKey] || FONT_MAP.batang;

    // (A) 실제 한글 폰트 렌더링
    ctx.font = `bold ${fontInfo.size}px ${fontInfo.family}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = `rgba(148, 163, 184, ${guideOpacity * 1.2})`;
    ctx.fillText(currentChar, canvas.width / 2, canvas.height / 2 + fontInfo.offsetY);

    // (B) 폰트 위에 은은한 중심 점선 가이드도 함께 표시하여 획순을 정확히 따라쓸 수 있도록 보조
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 8]);
    ctx.strokeStyle = `rgba(100, 116, 139, ${guideOpacity * 0.75})`;
    strokes.forEach(s => {
      if (s.type === 'circle') {
        ctx.beginPath();
        ctx.arc(s.cx, s.cy, s.r, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(s.pts[0][0], s.pts[0][1]);
        for (let i = 1; i < s.pts.length; i++) ctx.lineTo(s.pts[i][0], s.pts[i][1]);
        ctx.stroke();
      }
    });
  }

  ctx.restore();
}

/* 통합 씬 렌더러 */
function renderScene(animStrokeIdx = -1, animProgress = 0) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const strokes = getStrokesForChar(currentChar);

  // 1. 바탕에 따라쓰기 한글 폰트 렌더링 (오차 0% 완벽 일치)
  drawBackgroundGuide(strokes);

  // 2. 모드별 획 그리기
  if (studioMode === 'free') {
    // 자유 그리기 궤적들
    freehandStrokes.forEach(stk => {
      if (stk.length < 2) return;
      ctx.save();
      ctx.strokeStyle = currentBrushColor;
      ctx.lineWidth = 34;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(stk[0].x, stk[0].y);
      for (let i = 1; i < stk.length; i++) ctx.lineTo(stk[i].x, stk[i].y);
      ctx.stroke();
      ctx.restore();
    });
  } else if (studioMode === 'test') {
    // [따라쓰기 테스트 모드]
    // (a) 이미 맞춘 획들: 초록색 완료 표시 (바탕 홈을 꽉 채움)
    for (let i = 0; i < testCompletedCount; i++) {
      drawStaticStroke(strokes[i], '#10b981', 36);
      drawBadge(i + 1, getStrokeStartPoint(strokes[i]), '#10b981');
    }

    // (b) 현재 써야 할 획: 시작점 펄스 배지
    if (testCompletedCount < strokes.length) {
      const activeStroke = strokes[testCompletedCount];
      drawBadge(testCompletedCount + 1, getStrokeStartPoint(activeStroke), '#2563eb', true);
    }

    // (c) 사용자가 실시간으로 긋고 있는 궤적
    if (userPoints.length > 1) {
      ctx.save();
      ctx.strokeStyle = currentBrushColor;
      ctx.lineWidth = 34;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(userPoints[0].x, userPoints[0].y);
      for (let i = 1; i < userPoints.length; i++) ctx.lineTo(userPoints[i].x, userPoints[i].y);
      ctx.stroke();
      ctx.restore();
    }
  } else if (studioMode === 'anim') {
    // [애니메이션 모드]
    if (isAnimating && animStrokeIdx >= 0) {
      // 이미 재생 완료된 획들
      for (let i = 0; i < animStrokeIdx; i++) {
        drawStaticStroke(strokes[i], currentBrushColor, 36);
        drawBadge(i + 1, getStrokeStartPoint(strokes[i]), '#2563eb');
      }
      // 현재 보간 중인 획
      if (animStrokeIdx < strokes.length) {
        drawProgressStroke(strokes[animStrokeIdx], animProgress, currentBrushColor);
        drawBadge(animStrokeIdx + 1, getStrokeStartPoint(strokes[animStrokeIdx]), '#f59e0b', true);
      }
    } else if (animCompleted) {
      // 재생 완료 상태: 모든 획을 완벽하게 채워진 완성 상태로 영구 표시!
      for (let i = 0; i < strokes.length; i++) {
        drawStaticStroke(strokes[i], currentBrushColor, 36);
        drawBadge(i + 1, getStrokeStartPoint(strokes[i]), '#10b981');
      }
    } else if (currentStepIndex >= 0) {
      // 1획씩 보기 상태
      for (let i = 0; i <= currentStepIndex && i < strokes.length; i++) {
        const isCurrent = (i === currentStepIndex);
        drawStaticStroke(strokes[i], isCurrent ? '#f59e0b' : currentBrushColor, 36);
        drawBadge(i + 1, getStrokeStartPoint(strokes[i]), isCurrent ? '#f59e0b' : '#2563eb');
      }
    }
  }
}

function getStrokeStartPoint(s) {
  if (s.type === 'circle') {
    return { x: s.cx, y: s.cy - s.r }; // 12시 방향 꼭대기
  }
  return { x: s.pts[0][0], y: s.pts[0][1] };
}

function drawBadge(num, pos, bgColor = '#2563eb', isPulsing = false) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.25)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 2;

  ctx.fillStyle = bgColor;
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, 22, 0, Math.PI * 2);
  ctx.fill();

  if (isPulsing) {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 20px "JetBrains Mono", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(num, pos.x, pos.y + 1);
  ctx.restore();
}

function drawStaticStroke(s, color, width = 34) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (s.type === 'circle') {
    ctx.beginPath();
    ctx.arc(s.cx, s.cy, s.r, 0, Math.PI * 2);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(s.pts[0][0], s.pts[0][1]);
    for (let i = 1; i < s.pts.length; i++) ctx.lineTo(s.pts[i][0], s.pts[i][1]);
    ctx.stroke();
  }
  ctx.restore();
}

function drawGuideStroke(s) {
  ctx.save();
  ctx.strokeStyle = 'rgba(59, 130, 246, 0.45)';
  ctx.lineWidth = 14;
  ctx.setLineDash([8, 12]);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (s.type === 'circle') {
    ctx.beginPath();
    ctx.arc(s.cx, s.cy, s.r, 0, Math.PI * 2);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(s.pts[0][0], s.pts[0][1]);
    for (let i = 1; i < s.pts.length; i++) ctx.lineTo(s.pts[i][0], s.pts[i][1]);
    ctx.stroke();
  }
  ctx.restore();
}

function drawProgressStroke(s, progress, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 36;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (s.type === 'circle') {
    // 훈민정음 필순 규칙: 12시 꼭대기에서 '반시계 방향'으로 회전
    const startAngle = -Math.PI / 2;
    const currentAngle = startAngle - (Math.PI * 2 * progress);
    ctx.beginPath();
    ctx.arc(s.cx, s.cy, s.r, startAngle, currentAngle, true); // true = anticlockwise
    ctx.stroke();

    const headX = s.cx + s.r * Math.cos(currentAngle);
    const headY = s.cy + s.r * Math.sin(currentAngle);
    drawBrushHead(headX, headY);
  } else {
    const pts = s.pts;
    if (pts.length < 2) { ctx.restore(); return; }

    let totalLen = 0;
    const lens = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const d = Math.hypot(pts[i+1][0] - pts[i][0], pts[i+1][1] - pts[i][1]);
      lens.push(d);
      totalLen += d;
    }

    const targetDist = totalLen * progress;
    let curDist = 0;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    let lastX = pts[0][0], lastY = pts[0][1];

    for (let i = 0; i < lens.length; i++) {
      const segLen = lens[i];
      if (curDist + segLen <= targetDist) {
        ctx.lineTo(pts[i+1][0], pts[i+1][1]);
        curDist += segLen;
        lastX = pts[i+1][0];
        lastY = pts[i+1][1];
      } else {
        const remain = targetDist - curDist;
        const frac = remain / (segLen || 1);
        lastX = pts[i][0] + (pts[i+1][0] - pts[i][0]) * frac;
        lastY = pts[i][1] + (pts[i+1][1] - pts[i][1]) * frac;
        ctx.lineTo(lastX, lastY);
        break;
      }
    }
    ctx.stroke();
    drawBrushHead(lastX, lastY);
  }
  ctx.restore();
}

function drawBrushHead(x, y) {
  ctx.save();
  ctx.fillStyle = '#ffedd5';
  ctx.shadowColor = '#f59e0b';
  ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.arc(x, y, 18, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#f59e0b';
  ctx.beginPath();
  ctx.arc(x, y, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

/* ─────────────────────────────────────────────────────────────
   5. 실시간 오프라인 획순 판정 알고리즘 (Stroke Validator)
───────────────────────────────────────────────────────────── */
function dist(p1, p2) {
  return Math.hypot(p1.x - p2.x, p1.y - p2.y);
}

function validateUserStroke(points, targetStroke) {
  if (!points || points.length < 2) return { pass: false, reason: '너무 짧은 선입니다.' };

  if (targetStroke.type === 'circle') {
    if (points.length < 8) return { pass: false, reason: '원을 끝까지 부드럽게 감아주세요.' };
    const cx = targetStroke.cx;
    const cy = targetStroke.cy;
    const r = targetStroke.r;
    const uStart = points[0];
    const uEnd = points[points.length - 1];

    // 시작점 (12시 꼭대기 검사)
    const topPt = { x: cx, y: cy - r };
    if (dist(uStart, topPt) > r * 0.95) {
      return { pass: false, reason: '12시(위쪽) 꼭대기에서부터 시작해 주세요.' };
    }

    // 각도 누적 (반시계 방향 검사)
    let angleSum = 0;
    for (let i = 0; i < points.length - 1; i++) {
      const th1 = Math.atan2(points[i].y - cy, points[i].x - cx);
      const th2 = Math.atan2(points[i + 1].y - cy, points[i + 1].x - cx);
      let diff = th2 - th1;
      while (diff < -Math.PI) diff += Math.PI * 2;
      while (diff > Math.PI) diff -= Math.PI * 2;
      angleSum += diff;
    }

    if (angleSum > 1.4) {
      return { pass: false, reason: '시계 방향이 아닌 [반시계 방향]으로 회전해 주세요.' };
    }
    if (Math.abs(angleSum) < Math.PI * 1.3) {
      return { pass: false, reason: '원을 한 바퀴 완전히 감아주세요.' };
    }
    if (dist(uStart, uEnd) > r * 1.1) {
      return { pass: false, reason: '원의 시작점과 끝점을 닫아주세요.' };
    }
    return { pass: true, reason: '완벽한 획입니다!' };
  }

  // 선(Lines) 판정
  const pts = targetStroke.pts;
  const startPt = { x: pts[0][0], y: pts[0][1] };
  const endPt = { x: pts[pts.length - 1][0], y: pts[pts.length - 1][1] };
  const uStart = points[0];
  const uEnd = points[points.length - 1];

  // 1. 시작점 검사
  if (dist(uStart, startPt) > 95) {
    return { pass: false, reason: '시작점에서부터 그어주세요. (파란색 배지 위치)' };
  }

  // 2. 끝점 검사
  if (dist(uEnd, endPt) > 105) {
    return { pass: false, reason: '획의 끝점까지 완전히 그어주세요.' };
  }

  // 3. 방향성 코사인 유사도
  const tvx = endPt.x - startPt.x;
  const tvy = endPt.y - startPt.y;
  const uvx = uEnd.x - uStart.x;
  const uvy = uEnd.y - uStart.y;
  const tLen = Math.hypot(tvx, tvy);
  const uLen = Math.hypot(uvx, uvy);

  if (tLen > 30 && uLen > 30) {
    const dot = (tvx * uvx + tvy * uvy) / (tLen * uLen);
    if (dot < 0.35) {
      return { pass: false, reason: '올바른 방향(화살표 방향)으로 그어주세요.' };
    }
  }

  return { pass: true, reason: '완벽합니다!' };
}

/* ─────────────────────────────────────────────────────────────
   6. 터치 및 포인터 이벤트 리스너 (DPI & 스케일 완벽 보정)
───────────────────────────────────────────────────────────── */
function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

function handlePointerDown(e) {
  if (isAnimating) return;
  isPointerDown = true;
  canvas.setPointerCapture(e.pointerId);

  const pt = getCanvasCoords(e);
  userPoints = [pt];

  if (studioMode === 'free') {
    freehandStrokes.push([pt]);
    Sound.tap(0.9);
  }
}

function handlePointerMove(e) {
  if (!isPointerDown || isAnimating) return;
  const pt = getCanvasCoords(e);

  // 최소 샘플링 거리 필터
  const lastPt = userPoints[userPoints.length - 1];
  if (lastPt && Math.hypot(pt.x - lastPt.x, pt.y - lastPt.y) < 5) return;

  userPoints.push(pt);

  if (studioMode === 'free') {
    const cur = freehandStrokes[freehandStrokes.length - 1];
    if (cur) cur.push(pt);
  }

  renderScene();
}

function handlePointerUp(e) {
  if (!isPointerDown) return;
  isPointerDown = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}

  if (studioMode === 'test') {
    const strokes = getStrokesForChar(currentChar);
    if (testCompletedCount < strokes.length) {
      const target = strokes[testCompletedCount];
      const result = validateUserStroke(userPoints, target);

      if (result.pass) {
        testCompletedCount++;
        Sound.success();
        updateTimelineStatus();

        const progressPercent = (testCompletedCount / strokes.length) * 100;
        document.getElementById('anim-progress-fill').style.width = `${progressPercent}%`;

        if (testCompletedCount >= strokes.length) {
          Sound.fanfare();
          setFeedback('🎉', `축하합니다! '${currentChar}' 글자의 모든 획을 완벽하게 썼습니다!`, 'success');
          speakCurrentChar();
        } else {
          setFeedback('✨', `좋아요! [${testCompletedCount + 1}획]을 이어서 써보세요.`, 'success');
        }
      } else {
        Sound.error();
        setFeedback('⚠️', result.reason, 'error');
      }
    }
  }

  userPoints = [];
  renderScene();
}

canvas.addEventListener('pointerdown', handlePointerDown);
canvas.addEventListener('pointermove', handlePointerMove);
canvas.addEventListener('pointerup', handlePointerUp);
canvas.addEventListener('pointercancel', handlePointerUp);

/* ─────────────────────────────────────────────────────────────
   7. 애니메이션 재생 & 1획씩 보기 컨트롤러
───────────────────────────────────────────────────────────── */
function startStrokeAnimation() {
  if (isAnimating) return;
  setStudioMode('anim');
  isAnimating = true;
  animCompleted = false;

  const btnAnim = document.getElementById('btn-play-anim');
  const btnClear = document.getElementById('btn-clear');
  const btnStep = document.getElementById('btn-step-anim');
  const progressFill = document.getElementById('anim-progress-fill');

  btnAnim.innerHTML = '<span>⏳</span> 재생 중...';
  btnAnim.disabled = true;
  btnClear.disabled = true;
  btnStep.disabled = true;

  const strokes = getStrokesForChar(currentChar);
  if (!strokes.length) {
    finishAnim();
    return;
  }

  let strokeIdx = 0;

  function runNextStroke() {
    if (!isAnimating) return;
    if (strokeIdx >= strokes.length) {
      finishAnim();
      return;
    }

    highlightTimelineStep(strokeIdx);
    Sound.tap(1 + strokeIdx * 0.12);

    let startTime = null;
    const duration = 460;

    function step(timestamp) {
      if (!isAnimating) return;
      if (!startTime) startTime = timestamp;
      const progress = Math.min(1.0, (timestamp - startTime) / duration);

      const totalPercent = ((strokeIdx + progress) / strokes.length) * 100;
      progressFill.style.width = `${totalPercent}%`;

      renderScene(strokeIdx, progress);

      if (progress < 1.0) {
        currentAnimRafId = requestAnimationFrame(step);
      } else {
        strokeIdx++;
        setTimeout(runNextStroke, 180);
      }
    }

    currentAnimRafId = requestAnimationFrame(step);
  }

  function finishAnim() {
    isAnimating = false;
    animCompleted = true;
    currentAnimRafId = null;
    btnAnim.innerHTML = '<span>✨</span> 획순 다시 보기';
    btnAnim.disabled = false;
    btnClear.disabled = false;
    btnStep.disabled = false;
    progressFill.style.width = '100%';
    Sound.fanfare();
    speakCurrentChar();
    renderScene();
  }

  runNextStroke();
}

function stepNextStroke() {
  cancelCurrentAnimation();
  setStudioMode('anim');
  animCompleted = false;

  const strokes = getStrokesForChar(currentChar);
  if (!strokes.length) return;

  currentStepIndex = (currentStepIndex + 1) % (strokes.length + 1);
  const progressFill = document.getElementById('anim-progress-fill');

  if (currentStepIndex === strokes.length) {
    Sound.fanfare();
    animCompleted = true;
    progressFill.style.width = '100%';
    speakCurrentChar();
    highlightTimelineStep(-1);
    renderScene();
    return;
  }

  progressFill.style.width = `${((currentStepIndex + 1) / strokes.length) * 100}%`;
  highlightTimelineStep(currentStepIndex);
  Sound.tap(1 + currentStepIndex * 0.15);
  renderScene();
}

function clearCanvas() {
  Sound.tap();
  cancelCurrentAnimation();
  animCompleted = false;
  testCompletedCount = 0;
  freehandStrokes = [];
  userPoints = [];
  currentStepIndex = -1;
  document.getElementById('anim-progress-fill').style.width = '0%';
  highlightTimelineStep(-1);
  if (studioMode === 'test') {
    setFeedback('🎯', `1획: 파란색 배지(①)에서 시작하여 따라 써보세요!`, 'normal');
  }
  renderScene();
}

function saveCanvasImage() {
  Sound.tap(1.5);
  const link = document.createElement('a');
  link.download = `hangul_stroke_${currentChar}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function onGuideOpacityChange() {
  const val = document.getElementById('guide-opacity').value;
  guideOpacity = parseInt(val) / 100;
  renderScene();
}

function setBrushColor(color, element) {
  currentBrushColor = color;
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
  if (element) element.classList.add('active');
  renderScene();
}

/* ─────────────────────────────────────────────────────────────
   8. 대시보드 및 프리셋 관리
───────────────────────────────────────────────────────────── */
function updateTimelineStatus() {
  document.querySelectorAll('.stroke-step-item').forEach((el, i) => {
    el.classList.toggle('completed', i < testCompletedCount);
    el.classList.toggle('active', i === testCompletedCount);
  });
}

function highlightTimelineStep(idx) {
  document.querySelectorAll('.stroke-step-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
    if (i === idx) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
}

function updateInfoDashboard() {
  const dec = decompose(currentChar);
  const strokes = getStrokesForChar(currentChar);

  // 헤어로 카드
  document.getElementById('hero-char-box').textContent = currentChar;
  document.getElementById('hero-char-title').textContent = dec.isSyllable ? `음절 '${currentChar}'` : `자모 '${currentChar}'`;
  document.getElementById('hero-strokes-tag').textContent = `총 ${strokes.length}획`;

  const isVert = dec.isSyllable && [0, 1, 2, 3, 4, 5, 6, 7, 20].includes(dec.jungIdx);
  if (dec.isSyllable) {
    document.getElementById('hero-struct-tag').textContent = isVert ? '좌우 분립형 (세로모음)' : '상하 결합형 (가로모음)';
    document.getElementById('hero-batchim-tag').textContent = dec.hasJong ? `받침 있음 (${dec.jong})` : '받침 없음';
  } else {
    document.getElementById('hero-struct-tag').textContent = '단일 음소';
    document.getElementById('hero-batchim-tag').textContent = '기본 자모';
  }

  // 3분해 슬롯 카드
  const jongSlot = document.getElementById('slot-jong');

  if (dec.isSyllable) {
    const choStks = getJamoStrokesInBox(dec.cho, {x:0, y:0, w:100, h:100}, '');
    const jungStks = getJamoStrokesInBox(dec.jung, {x:0, y:0, w:100, h:100}, '');
    document.getElementById('jamo-cho-val').textContent = dec.cho;
    document.getElementById('jamo-cho-desc').textContent = `${choStks.length}획`;
    document.getElementById('jamo-jung-val').textContent = dec.jung;
    document.getElementById('jamo-jung-desc').textContent = `${jungStks.length}획`;
    
    if (dec.hasJong) {
      const jongStks = getJamoStrokesInBox(dec.jong, {x:0, y:0, w:100, h:100}, '');
      document.getElementById('jamo-jong-val').textContent = dec.jong;
      document.getElementById('jamo-jong-desc').textContent = `${jongStks.length}획`;
      jongSlot.style.opacity = '1';
    } else {
      document.getElementById('jamo-jong-val').textContent = '—';
      document.getElementById('jamo-jong-desc').textContent = '받침 없음';
      jongSlot.style.opacity = '0.5';
    }
  } else {
    document.getElementById('jamo-cho-val').textContent = currentChar;
    document.getElementById('jamo-cho-desc').textContent = `${strokes.length}획`;
    document.getElementById('jamo-jung-val').textContent = '—';
    document.getElementById('jamo-jung-desc').textContent = '단일 글자';
    document.getElementById('jamo-jong-val').textContent = '—';
    document.getElementById('jamo-jong-desc').textContent = '해당 없음';
    jongSlot.style.opacity = '0.4';
  }

  // 타임라인 리스트 생성
  document.getElementById('timeline-count-badge').textContent = `총 ${strokes.length}획`;
  const listEl = document.getElementById('timeline-steps-list');

  listEl.innerHTML = strokes.map((s, idx) => `
    <div class="stroke-step-item" id="step-card-${idx}" onclick="selectStrokeFromTimeline(${idx})">
      <div class="step-num-badge">${idx + 1}</div>
      <div class="step-info-col">
        <div class="step-part-tag">${s.partName}</div>
        <div class="step-instruction">${s.desc}</div>
      </div>
    </div>
  `).join('');

  updateTimelineStatus();
}

function selectStrokeFromTimeline(idx) {
  cancelCurrentAnimation();
  setStudioMode('anim');
  currentStepIndex = idx;
  highlightTimelineStep(idx);
  renderScene();
  Sound.tap(1.2);
}

function switchPresetTab(tabKey) {
  currentTab = tabKey;
  document.querySelectorAll('.preset-tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('onclick').includes(tabKey));
  });

  const box = document.getElementById('preset-chips-box');
  const items = PRESET_DATA[tabKey] || [];
  box.innerHTML = items.map(c => `
    <button class="preset-chip ${c === currentChar ? 'active' : ''}" onclick="loadPreset('${c}')">
      ${c}
    </button>
  `).join('');
}

function applyCharFromInput() {
  const val = document.getElementById('input-char').value.trim();
  if (val) {
    loadPreset(val[0]);
  }
}

function loadPreset(char) {
  currentChar = char;
  document.getElementById('input-char').value = char;

  document.querySelectorAll('.preset-chip').forEach(c => {
    c.classList.toggle('active', c.textContent.trim() === char);
  });

  cancelCurrentAnimation();
  testCompletedCount = 0;
  freehandStrokes = [];
  userPoints = [];
  currentStepIndex = -1;

  updateInfoDashboard();
  if (studioMode === 'test') {
    setFeedback('🎯', `1획: 파란색 배지(①)에서 시작하여 따라 써보세요!`, 'normal');
  }
  renderScene();
  speakCurrentChar();
}

document.getElementById('input-char').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') applyCharFromInput();
});

// 시작 초기화
window.addEventListener('DOMContentLoaded', () => {
  switchPresetTab('basic');
  loadPreset('아');
  setStudioMode('test');
});
</script>
