<style>
:root {
  --green: #58cc02;
  --green-dark: #58a700;
  --blue: #1cb0f6;
  --blue-dark: #1899d6;
  --gold: #ffc800;
  --gold-dark: #e5a500;
  --red: #ff4b4b;
  --gray-100: #f7f7f7;
  --gray-200: #e5e5e5;
  --gray-300: #d0d0d0;
  --gray-700: #4b4b4b;
  --gray-800: #3c3c3c;
  --radius: 16px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  font-family: 'Nunito', 'Noto Sans KR', sans-serif;
}

body {
  background: #f0f2f5;
  color: var(--gray-800);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px;
}

.studio-card {
  width: 100%;
  max-width: 460px;
  background: #fff;
  border-radius: 24px;
  box-shadow: 0 12px 36px rgba(0,0,0,0.08);
  border: 2px solid var(--gray-200);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px;
}

.studio-header {
  text-align: center;
  margin-bottom: 20px;
  width: 100%;
}
.studio-title {
  font-size: 20px;
  font-weight: 900;
  color: var(--green-dark);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.studio-subtitle {
  font-size: 13px;
  color: var(--gray-700);
  margin-top: 4px;
  font-weight: 600;
}

/* 글자 입력 & 프리셋 바 */
.char-input-group {
  display: flex;
  gap: 8px;
  width: 100%;
  margin-bottom: 12px;
}
.char-input {
  flex: 1;
  padding: 12px 16px;
  font-size: 18px;
  font-weight: 900;
  border: 2px solid var(--gray-300);
  border-radius: var(--radius);
  text-align: center;
  outline: none;
  background: #fafafa;
}
.char-input:focus {
  border-color: var(--blue);
  background: #fff;
}

.preset-chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  margin-bottom: 20px;
  width: 100%;
}
.preset-chip {
  padding: 6px 12px;
  background: var(--gray-100);
  border: 1.5px solid var(--gray-200);
  border-radius: 12px;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 2px 0 var(--gray-200);
  transition: all 0.1s;
}
.preset-chip:active {
  transform: translateY(2px);
  box-shadow: none;
}
.preset-chip.active {
  background: #e7f7ff;
  border-color: var(--blue);
  color: var(--blue-dark);
}

/* 캔버스 뷰포트 */
.canvas-wrapper {
  position: relative;
  width: 280px;
  height: 280px;
  background: #ffffff;
  border: 3px dashed var(--gray-300);
  border-radius: 24px;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.03);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* 십자 원고지 가이드라인 */
.canvas-grid-line-h {
  position: absolute;
  left: 0; right: 0; top: 50%;
  height: 1px;
  border-top: 1px dashed rgba(0,0,0,0.12);
  pointer-events: none;
}
.canvas-grid-line-v {
  position: absolute;
  top: 0; bottom: 0; left: 50%;
  width: 1px;
  border-left: 1px dashed rgba(0,0,0,0.12);
  pointer-events: none;
}

#stroke-canvas {
  width: 280px;
  height: 280px;
  touch-action: none;
  cursor: crosshair;
}

/* 3D 컨트롤 버튼 */
.btn-3d {
  position: relative;
  border: none;
  outline: none;
  cursor: pointer;
  border-radius: var(--radius);
  font-weight: 800;
  font-size: 15px;
  letter-spacing: 0.5px;
  padding: 12px 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.1s ease;
}
.btn-3d:active {
  transform: translateY(4px);
}

.btn-primary {
  background: var(--green);
  color: #fff;
  box-shadow: 0 4px 0 var(--green-dark);
}
.btn-primary:active { box-shadow: 0 0 0 var(--green-dark); }

.btn-blue {
  background: var(--blue);
  color: #fff;
  box-shadow: 0 4px 0 var(--blue-dark);
}
.btn-blue:active { box-shadow: 0 0 0 var(--blue-dark); }

.btn-gray {
  background: var(--gray-200);
  color: var(--gray-700);
  box-shadow: 0 4px 0 var(--gray-300);
}
.btn-gray:active { box-shadow: 0 0 0 var(--gray-300); }

.button-row {
  display: flex;
  gap: 10px;
  width: 100%;
  margin-bottom: 20px;
}

/* 획순 분석 정보 패널 */
.info-card {
  width: 100%;
  background: #f8fafc;
  border: 1.5px solid var(--gray-200);
  border-radius: var(--radius);
  padding: 16px;
}
.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid var(--gray-200);
  font-size: 14px;
}
.info-row:last-child {

}
.info-label {
  font-weight: 700;
  color: var(--gray-700);
}
.info-val {
  font-weight: 900;
  color: var(--green-dark);
}
.stroke-steps-list {
  margin-top: 10px;
  font-size: 12.5px;
  color: var(--gray-700);
  font-weight: 600;
  line-height: 1.6;
}

<script>
/* ── Web Audio Synth (오프라인 효과음) ── */
const Sound = {
  ctx: null,
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
  },
  tap(pitch = 1) {
    this.init();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440 * pitch, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880 * pitch, this.ctx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.05);
  },
  complete() {
    this.init();
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.18, this.ctx.currentTime + idx * 0.06);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.06 + 0.25);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + idx * 0.06);
      osc.stop(this.ctx.currentTime + idx * 0.06 + 0.25);
    });
  }
};

/* ── TTS 음성 재생 ── */
function speak(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ko-KR';
    utter.rate = 0.9;
    window.speechSynthesis.speak(utter);
  }
}

/* ── 한글 획순 벡터 데이터베이스 ── */
const STROKE_DB = {

  ],

    { type: 'lines', pts: [[36, 35], [36, 85]], desc: '왼쪽 기둥' },
    { type: 'lines', pts: [[64, 35], [64, 85]], desc: '오른쪽 기둥' }
  ],
  'ㅡ': [{ type: 'lines', pts: [[12, 50], [88, 50]], desc: '가로선' }],
  'ㅣ': [{ type: 'lines', pts: [[50, 12], [50, 88]], desc: '세로선' }]
};

const CHOS = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNGS = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONGS = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

let currentChar = '아';
const canvas = document.getElementById('stroke-canvas');
const ctx = canvas.getContext('2d');
let isAnimating = false;

function decompose(char) {
  const code = char.charCodeAt(0) - 0xAC00;
  if (code >= 0 && code <= 11171) {
    const jong = code % 28;
    const jung = Math.floor((code - jong) / 28) % 21;
    const cho = Math.floor((code - jong) / 28 / 21);
    return {
      isSyllable: true,
      cho: CHOS[cho],
      jung: JUNGS[jung],
      jong: JONGS[jong],
      jungIdx: jung,
      hasJong: jong > 0
    };
  }
  return { isSyllable: false, char: char };
}

function getStrokesForChar(char) {
  const dec = decompose(char);
  let strokes = [];

  function transform(stk, box, partName) {
    if (stk.type === 'circle') {
      return {
        type: 'circle',
        cx: box.x + (stk.cx / 100) * box.w,
        cy: box.y + (stk.cy / 100) * box.h,
        r: (stk.r / 100) * Math.min(box.w, box.h),
        desc: `${partName}: ${stk.desc}`
      };
    }
    return {
      type: 'lines',
      pts: stk.pts.map(p => [
        box.x + (p[0] / 100) * box.w,
        box.y + (p[1] / 100) * box.h
      ]),
      desc: `${partName}: ${stk.desc}`
    };
  }

  if (dec.isSyllable) {
    const isVert = [0, 1, 2, 3, 4, 5, 6, 7, 20].includes(dec.jungIdx);
    let choBox, jungBox, jongBox;

    if (isVert && !dec.hasJong) {
      choBox = { x: 30, y: 40, w: 105, h: 190 };
      jungBox = { x: 145, y: 30, w: 105, h: 215 };
    } else if (!isVert && !dec.hasJong) {
      choBox = { x: 40, y: 30, w: 200, h: 105 };
      jungBox = { x: 30, y: 140, w: 220, h: 110 };
    } else {
      choBox = { x: 30, y: 25, w: 105, h: 110 };
      jungBox = { x: 145, y: 20, w: 105, h: 120 };
      jongBox = { x: 50, y: 155, w: 180, h: 100 };
    }

    if (STROKE_DB[dec.cho]) {
      STROKE_DB[dec.cho].forEach(s => strokes.push(transform(s, choBox, `초성 '${dec.cho}'`)));
    }
    if (STROKE_DB[dec.jung]) {
      STROKE_DB[dec.jung].forEach(s => strokes.push(transform(s, jungBox, `중성 '${dec.jung}'`)));
    }
    if (dec.hasJong && STROKE_DB[dec.jong]) {
      STROKE_DB[dec.jong].forEach(s => strokes.push(transform(s, jongBox, `종성 '${dec.jong}'`)));
    }
  } else if (STROKE_DB[char]) {
    const box = { x: 40, y: 40, w: 200, h: 200 };
    STROKE_DB[char].forEach(s => strokes.push(transform(s, box, `자모 '${char}'`)));
  }

  return strokes;
}

function updateInfoPanel() {
  const dec = decompose(currentChar);
  document.getElementById('info-char').textContent = currentChar;

  if (dec.isSyllable) {
    let str = `초성 ${dec.cho} + 중성 ${dec.jung}`;
    if (dec.hasJong) str += ` + 종성 ${dec.jong}`;
    document.getElementById('info-structure').textContent = str;
  } else {
    document.getElementById('info-structure').textContent = `단일 자모 (${currentChar})`;
  }

  const strokes = getStrokesForChar(currentChar);
  document.getElementById('info-stroke-count').textContent = `${strokes.length}획`;

  const badgeIcons = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨', '⑩'];
  document.getElementById('info-stroke-steps').innerHTML = strokes.map((s, i) => {
    return `${badgeIcons[i] || (i+1)} ${i+1}획: ${s.desc}`;
  }).join('<br>');
}

function drawBaseGuide() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.font = 'bold 180px "Nanum Myeongjo", Gungsuh, "Noto Serif KR", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#eaeaea';
  ctx.fillText(currentChar, 140, 140);
}

function drawBrushHead(x, y) {
  ctx.save();
  ctx.fillStyle = '#ffc800';
  ctx.shadowColor = '#ffc800';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(x, y, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawPolylineProgress(pts, progress) {
  if (pts.length < 2) return;
  let totalLen = 0;
  const lens = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const dist = Math.hypot(pts[i+1][0] - pts[i][0], pts[i+1][1] - pts[i][1]);
    lens.push(dist);
    totalLen += dist;
  }

  const targetDist = totalLen * progress;
  let curDist = 0;

  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  let lastX = pts[0][0], lastY = pts[0][1];

  for (let i = 0; i < lens.length; i++) {
    const segLen = lens[i];
    if (curDist + segLen <= targetDist) {
      ctx.lineTo(pts[i+1][0], pts[i+1][1]);
      curDist += segLen;
      lastX = pts[i+1][0];
      lastY = pts[i+1][1];
    } else {
      const remain = targetDist - curDist;
      const frac = remain / (segLen || 1);
      lastX = pts[i][0] + (pts[i+1][0] - pts[i][0]) * frac;
      lastY = pts[i][1] + (pts[i+1][1] - pts[i][1]) * frac;
      ctx.lineTo(lastX, lastY);
      break;
    }
  }
  ctx.stroke();
  drawBrushHead(lastX, lastY);
}

function startStrokeAnimation() {
  if (isAnimating) return;
  isAnimating = true;

  const btnAnim = document.getElementById('btn-play-anim');
  const btnClear = document.getElementById('btn-clear');
  btnAnim.innerHTML = '⏳ 획순 그리는 중...';
  btnAnim.disabled = true;
  btnClear.disabled = true;

  drawBaseGuide();

  const strokes = getStrokesForChar(currentChar);
  if (!strokes.length) {
    ctx.fillStyle = 'rgba(88, 204, 2, 0.6)';
    ctx.fillText(currentChar, 140, 140);
    finishAnim();
    return;
  }

  let strokeIdx = 0;

  function runNextStroke() {
    if (!isAnimating) return;
    if (strokeIdx >= strokes.length) {
      finishAnim();
      return;
    }

    const currentStroke = strokes[strokeIdx];
    Sound.tap(1 + strokeIdx * 0.1);

    const badgeNum = strokeIdx + 1;
    let badgePos = { x: 0, y: 0 };
    if (currentStroke.type === 'circle') {
      badgePos = { x: currentStroke.cx, y: currentStroke.cy - currentStroke.r - 12 };
    } else {
      badgePos = { x: currentStroke.pts[0][0] - 14, y: currentStroke.pts[0][1] - 14 };
    }

    // 배지 드로잉
    ctx.save();
    ctx.fillStyle = '#1cb0f6';
    ctx.beginPath();
    ctx.arc(badgePos.x, badgePos.y, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px Nunito, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(badgeNum, badgePos.x, badgePos.y);
    ctx.restore();

    let startTime = null;
    const duration = 420;

    function step(timestamp) {
      if (!isAnimating) return;
      if (!startTime) startTime = timestamp;
      const progress = Math.min(1.0, (timestamp - startTime) / duration);

      ctx.save();
      ctx.lineWidth = 16;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#58cc02';

      if (currentStroke.type === 'circle') {
        const startAngle = -Math.PI / 2;
        const currentAngle = startAngle + (Math.PI * 2 * progress);
        ctx.beginPath();
        ctx.arc(currentStroke.cx, currentStroke.cy, currentStroke.r, startAngle, currentAngle);
        ctx.stroke();

        const headX = currentStroke.cx + currentStroke.r * Math.cos(currentAngle);
        const headY = currentStroke.cy + currentStroke.r * Math.sin(currentAngle);
        drawBrushHead(headX, headY);
      } else {
        drawPolylineProgress(currentStroke.pts, progress);
      }
      ctx.restore();

      if (progress < 1.0) {
        requestAnimationFrame(step);
      } else {
        strokeIdx++;
        setTimeout(runNextStroke, 180);
      }
    }

    requestAnimationFrame(step);
  }

  function finishAnim() {
    isAnimating = false;
    btnAnim.innerHTML = '✨ 획순 다시 보기';
    btnAnim.disabled = false;
    btnClear.disabled = false;
    Sound.complete();
    speak(currentChar);
  }

  runNextStroke();
}

function clearCanvas() {
  Sound.tap();
  isAnimating = false;
  drawBaseGuide();
}

function applyCharFromInput() {
  const val = document.getElementById('input-char').value.trim();
  if (val) {
    loadPreset(val[0]);
  }
}

function loadPreset(char) {
  currentChar = char;
  document.getElementById('input-char').value = char;
  document.querySelectorAll('.preset-chip').forEach(c => {
    c.classList.toggle('active', c.textContent === char);
  });
  updateInfoPanel();
  clearCanvas();
  speak(char);
}

// 직접 터치/마우스 드로잉
let drawing = false;

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function startDraw(e) {
  if (isAnimating) return;
  drawing = true;
  const pos = getPos(e);
  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y);
  ctx.lineWidth = 16;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#58cc02';
}
function moveDraw(e) {
  if (!drawing || isAnimating) return;
  const pos = getPos(e);
  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();
}
function endDraw() { drawing = false; }

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', moveDraw);
canvas.addEventListener('mouseup', endDraw);
canvas.addEventListener('touchstart', startDraw);
canvas.addEventListener('touchmove', moveDraw);
canvas.addEventListener('touchend', endDraw);

window.addEventListener('DOMContentLoaded', () => {
  loadPreset('아');
});
</script>

</body>
